# ZeroSentinel 設定檔
# 缺少的項目會在啟動與 /zs reload 時自動補齊，原本的設定值會保留。

# 封包錄製
record:
  # 是否錄製（關閉後不追蹤任何玩家，也不佔用緩衝區記憶體）
  enabled: true
  # 每位玩家的環形緩衝區大小（KB，32～4096）。100 人約佔 buffer-kb × 100 的記憶體
  buffer-kb: 256
  # 開始錄製時，往前保留幾秒的封包（1～60）
  buffer-seconds: 10
  # 單一封包超過這個大小（KB）只記錄封包 ID 與長度（1～1024）
  max-packet-kb: 32
  # 產生新事件時自動錄製
  on-flag: true
  # 事件觸發後再繼續錄幾秒（0～60）
  after-flag-seconds: 5
  # 手動錄製（/zs record）的最長秒數（1～3600）。指令要求的秒數超過時會改為這個值並提示
  manual-max-seconds: 300
  # 單一錄製檔的最大未壓縮容量（MB，1～1024），超過就自動結束
  max-session-mb: 32

storage:
  recordings:
    # 錄製檔總容量上限（MB，0 = 不限制）。超過時從最舊的檔案開始刪除
    max-total-mb: 2048
    # 錄製檔保留天數（0 = 不限制）
    retention-days: 30
  database:
    # 每幾秒批次寫入一次（1～300）
    flush-seconds: 5
    # 累積幾筆就立即寫入（10～10000）
    batch-size: 500
    # 記憶體快取的事件數（100～100000），錯誤碼快取為兩倍
    cache-size: 2000
    # 事件、錯誤碼與信用點數修改紀錄的保留天數（0 = 不限制）
    retention-days: 30

events:
  # 同一位玩家、同一個分類在幾秒內的連續違規算同一個事件（1～3600）
  merge-window-seconds: 60

gui:
  # 在箱子 UI 按「開始錄製」時錄製的秒數（不會超過 record.manual-max-seconds）
  record-seconds: 60

display:
  # 時間顯示格式（Java DateTimeFormatter 格式）
  time-format: 'yyyy-MM-dd HH:mm:ss'

# 檢查
checks:
  # 進服、切換世界、重生後幾秒內不檢查
  join-grace-seconds: 15
  # 客戶端尚未回報載入完成時，最多再等幾秒才開始檢查
  max-load-wait-seconds: 60
  # 通知有 zerosentinel.alerts 權限的管理員
  alerts: true

  # 客戶端回報異常：正常的 Java 版客戶端每秒至少會送 1 個移動或 tick 結束封包
  client-report:
    enabled: true
    # 超過幾秒沒有移動 / tick 結束封包（但其他封包照常送達）算一次違規
    silence-seconds: 10
    # 持續異常時，每隔幾秒再算一次違規
    interval-seconds: 10
    # 正常信用下累積幾次違規踢出（會依信用點數調整，見 trust.high / trust.low）
    kick-after: 6
    # 踢出後幾分鐘內重新進服又違規，下一次檢查就直接踢出（0 = 關閉）
    repeat-kick-minutes: 30
    # 每次違規扣的信用點數
    trust-per-violation: 5
    # 踢出時再扣的信用點數
    trust-per-kick: 30
    # 超過幾秒沒有違規，違規次數歸零
    remove-violations-after: 60
    # 是否檢查基岩版玩家（封包經 Geyser 轉換，預設不檢查）
    check-bedrock: false
    # 注意：只有在「不送移動封包、但有聊天 / 指令 / 點擊等操作」時才走上面的處罰流程

  # 客戶端無回應：不送移動封包、也沒有任何操作，只剩 keep-alive 等網路層封包（通常是客戶端卡住）
  # 不扣信用、不警告，超過設定秒數就踢出並請玩家重新進入；不算入「踢出後再犯」
  client-frozen:
    enabled: true
    kick-after-seconds: 60

# 信用點數
trust:
  # 新玩家的初始分數
  start: 500
  # 分數上限
  max: 1000
  # 分數小於或等於這個值就無法進服（-1 = 關閉此功能）
  deny-join-at: 0
  # 連續在線且沒有違規時加分
  gain:
    amount: 2
    every-minutes: 30
    daily-cap: 20
  # 高信用：處罰前需要的違規次數 × multiplier
  high:
    threshold: 800
    multiplier: 2.0
  # 低信用：處罰前需要的違規次數 × multiplier
  low:
    threshold: 300
    multiplier: 0.5

# 伺服器卡頓
lag:
  # 看門狗偵測到所有執行緒停頓超過幾毫秒，視為伺服器整體停頓
  stall-threshold-ms: 1000
  # 停頓後幾秒內不累積違規
  grace-seconds: 5
  # TPS 低於這個值時暫停處罰（只記錄並通知管理員）
  min-tps: 18.0

debug:
  # 開啟 /zs debug 測試指令（正式環境請保持關閉）
  enabled: false

update-checker:
  # 啟動時檢查 GitHub 是否有新版本
  check-on-startup: true
  # 有 zerosentinel.version 權限的管理員登入 3 秒後提醒新版本
  notify-on-join: true
